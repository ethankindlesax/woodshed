<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Woodshed">
<title>Woodshed</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <path d="M2 24 32 4l30 20v38H2z" fill="#111"/>
        <path d="M8 34h48M8 42h12M44 42h12M8 50h12M44 50h12" stroke="#1e6fe0" stroke-width="1.6"/>
        <circle cx="32" cy="21" r="9.5" fill="#1e6fe0"/>
        <path d="M33.2 25.2V14.2c1.6 2.4 4.2 2.6 4 5.6" stroke="#111" stroke-width="2.2" fill="none"/>
        <ellipse cx="30.4" cy="25.6" rx="3.3" ry="2.4" fill="#111" transform="rotate(-20 30.4 25.6)"/>
        <rect x="23" y="38" width="18" height="24" fill="#1e6fe0"/>
        <circle cx="37" cy="51" r="1.3" fill="#111"/>
      </svg>
      <span>Est. 2026</span>
    </div>
    <div class="titles">
      <p class="logo"><span>Woodshed</span></p>
      <p class="kick" id="kick"></p>
      <h1 class="big" id="big"><span class="p"></span><span class="b"></span></h1>
      <p class="sub" id="sub"></p>
    </div>
    <button class="ghost icon" id="openSettings" aria-label="Habits and settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span id="syncDot" class="syncdot off"></span>
    </button>
  </header>

  <section class="week" aria-label="Week">
    <div class="weekhead">
      <button class="ghost icon" id="prevWeek" aria-label="Previous week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="weekLabel">This week</h2>
      <button class="ghost icon" id="nextWeek" aria-label="Next week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div id="grid" class="grid"></div>
    <p class="legend"><span class="key k1"></span>under 1h <span class="key k2"></span>1h+ <span class="key k3"></span>2h+ <em>Tap a square to log</em></p>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden>
  <span id="toastText"></span><button id="toastUndo" class="link">Undo</button>
</div>

<dialog id="cellDialog" class="sheet">
  <form method="dialog" class="sheethead">
    <div><h3 id="cellTitle"></h3><p class="sheetsub" id="cellSub"></p></div>
    <button class="ghost icon" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </form>
  <div class="adds">
    <button class="add a30" data-act="add" data-min="30">+30<small>min</small></button>
    <button class="add a60" data-act="add" data-min="60">+1<small>hour</small></button>
  </div>
  <div id="cellList"></div>
</dialog>

<dialog id="settingsDialog" class="sheet">
  <form method="dialog" class="sheethead"><h3>Habits</h3><button class="ghost icon" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></form>
  <div id="habitEditor"></div>
  <form id="newHabitForm" class="fields">
    <input id="newHabitName" placeholder="New habit" aria-label="New habit name" required>
    <button class="solid" type="submit">Add habit</button>
  </form>
  <h4>Sync</h4>
  <div id="syncBox"></div>
  <h4>Your data</h4>
  <p class="hint">Everything is saved on this device first. Export a backup now and then.</p>
  <div class="fields wrap">
    <button class="line" id="exportJson">Export backup (.json)</button>
    <button class="line" id="exportCsv">Export sessions (.csv)</button>
    <label class="line filebtn">Import backup<input type="file" id="importJson" accept="application/json,.json" hidden></label>
  </div>
</dialog>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
</body>
</html>
